name: cv-builder

services:

  # -----------------------------------------------------------------------
  # app — the VS Code devcontainer environment
  # Contains: Python 3.12, pandoc, Node.js, rendercv[full]
  # -----------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/cv:cached
    # Keep the container alive; VS Code attaches to it.
    command: sleep infinity
    # Makes host.docker.internal resolvable inside the container (needed
    # if you ever point PRINTER_APP_URL at the host network).
    extra_hosts:
      - host.docker.internal:host-gateway

  # -----------------------------------------------------------------------
  # postgres — database for Reactive Resume
  # Internal only; not exposed to the host.
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------------------------------------------------
  # browserless — headless Chromium used by Reactive Resume to render PDFs
  # -----------------------------------------------------------------------
  browserless:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    environment:
      QUEUED: "10"
      HEALTH: "true"
      CONCURRENT: "5"
      TOKEN: "1234567890"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/pressure?token=1234567890"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------------------------------------------------------
  # reactive_resume — visual CV builder (web UI at localhost:3000)
  # Import content/resume.json here for designer/UX-role variants.
  #
  # AUTH_SECRET: development placeholder only.
  # Generate a real one with `openssl rand -hex 32` before any internet-
  # exposed deployment.
  # -----------------------------------------------------------------------
  reactive_resume:
    image: amruthpillai/reactive-resume:v5.0.18
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Etc/UTC
      NODE_ENV: production
      APP_URL: http://localhost:3000
      # Internal URL so the printer service can reach the app from inside Docker.
      PRINTER_APP_URL: http://reactive_resume:3000
      PRINTER_ENDPOINT: ws://browserless:3000?token=1234567890
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      AUTH_SECRET: dev-only-change-before-any-internet-exposed-deployment
    volumes:
      - reactive_resume_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      browserless:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  reactive_resume_data:
